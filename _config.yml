url: "https://kedmahamelberg.com"
baseurl: ""
repository: "kedmahamelberg-ai/kedmahamelberg"
timezone: "Europe/Amsterdam"

title: "Kedma Hamelberg, PhD"
masthead_title: "Kedma Hamelberg"
email: "kedma@hamelberg-ai.com"

description: >-
  Applied AI researcher and builder working at the intersection of decision
  intelligence, digital behavior, marketing, and human impact. I develop
  auditable AI systems, large-scale computational research, and executive
  learning experiences that turn complex digital data into strategic decisions.

logo: "/assets/images/kh-mark.svg"
